[project]
name = "scikit-learn-inference-service"
version = "2.0.0"
description = "Microsserviço FastAPI que serve um modelo semi-supervisionado de detecção de anomalias."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = [
    "N803", "N806",  # X/X_train maiúsculo é convenção em ML
    "RUF001", "RUF002", "RUF003",  # acentos/travessões em textos em português
]
